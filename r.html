
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>HTML Roulette</title>

  <style>
		body {
			width: 100%;
	        height: 100vh;
			background: skyblue;
			overflow : hidden;
		}
		.container {
			display: grid;
			min-height: 100%;
			align-content: center;
			justify-content: center;
		}

		#roullete {
			width: 400px;
			height: 400px;
			border-radius: 50%;
			background: white;
			border: 3px solid black;
			position: relative;
		}

		.panel {
			position: absolute;
			width: 400px;
			height: 400px;
			border-radius: 50%;
			clip-path: polygon(0% 0%, 50% 50%, 0% 50%, 0% 0%);
		}

		.txt {
			font-size: 24px;
			width: 260px;
			height: 260px;
			position: absolute;
			top: 30px;
			left: 30px;
			text-align: center;
			transform: rotate(-78deg);
		}

		.arrow{
			left: 50%;
		  position: sticky;
		  z-index: 1;
			width: 0;
			height: 0;
			border-top: 30px solid purple;
			border-left: 10px solid transparent;
			border-right: 10px solid transparent;
		}
		button {
		  height : 50px;
		  font-size: 24px;
		}

  </style>

  <script type="text/javascript">

		window.onload = function(){
			setRoulettePanel();
		}

    	function setRoulettePanel(){
    		var panelArr =  document.querySelectorAll(".panel")
    		let panelArrSize = panelArr.length;
    		let rotate = 360 / panelArrSize;

    		var i = 0
    		var panelRotate = 0;
    		var panelInfoTbody = [];
    		while ( i < panelArrSize){
    			panelRotate = panelRotate + rotate;
    			panelArr[i].style.transform = "rotate("+panelRotate+"deg)";
    			//console.log(i + ":" + panelRotate + " deg");
    			i = i + 1;
    		}
    	}

    	function clickStartBtn() {
    		document.getElementById("roullete").style.animation = "";
    		var randomRotate = (Math.random() * 3000) + 1000;
    		var randomAnimation = (Math.random() * 7000) + 2000;
    		document.getElementById("roullete").animate([
    		    { transform: "rotate(0deg)" },{ transform: "rotate("+randomRotate + "deg)" } ],
    	      { fill: 'forwards', duration: randomAnimation, easing: 'ease-in-out' }
    		);
		  }
		  
		  let menu = ["치즈버거", "불고기버거","햄버거","김치찌게","찌장면","짬뽕","국밥","백반","국수","냉면"];
		  function setMenu() {
		      const txts = document.querySelectorAll(".txt");
		      for ( let i=0 ; i<txts.length ; i++ ) {
		        let k = Math.floor(Math.random() * menu.length) 
		        txts[i].innerText = menu[k];
		      }
		  }

    </script>
</head>
<body>
    	<div class="container">
    		<header class="header">
    			 <h1 class="title">오늘의 메</h1>
    		</header>
    		<div class="arrow"></div>
    		<div class="eq8" id="roullete">
				<div class="panel panel_1" style="background: #00D8FF;"><strong class="txt">김치찌게</strong></div>
				<div class="panel panel_2" style="background: #F2CB61;"><strong class="txt">스파게티</strong></div>
				<div class="panel panel_3" style="background: #FAECC5;"><strong class="txt">불고기</strong></div>
				<div class="panel panel_4" style="background: #665C00;"><strong class="txt">삼겹살</strong></div>
				<div class="panel panel_5" style="background: #476600;"><strong class="txt">햄버거</strong></div>
				<div class="panel panel_6" style="background: #2F9D27;"><strong class="txt">짜장면</strong></div>
				<div class="panel panel_7" style="background: #003399;"><strong class="txt">쩜뽕</strong></div>
				<div class="panel panel_8" style="background: #6B66FF;"><strong class="txt">백반</strong></div>
			</div>
			<button class="startBtn" onclick="setMenu();">메뉴 셋업</button>
			<button class="startBtn" onclick="clickStartBtn();">메뉴 고르기</button>

</body>
</html>
